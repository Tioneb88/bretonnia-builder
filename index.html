<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bretonnie - Organisateur d'Hoste Royal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght=600;800&family=MedievalSharp&family=Roboto:wght=400;500&display=swap');
        .font-medieval { font-family: 'MedievalSharp', cursive; }
        .font-cinzel { font-family: 'Cinzel', serif; }
    </style>
</head>
<body class="bg-gray-950 text-gray-100 font-sans min-h-screen flex flex-col">

    <header class="bg-gradient-to-r from-blue-950 via-slate-900 to-red-950 border-b-4 border-yellow-600 p-4 shadow-2xl text-center">
        <h1 class="text-3xl md:text-5xl font-medieval text-yellow-400 tracking-widest uppercase drop-shadow">Générateur d'Armée : Bretonnie</h1>
        <p class="text-xs md:text-sm text-yellow-200 mt-1 italic">"Honneur, Devoir, et Fidélité à la Dame du Lac"</p>
    </header>

    <main class="flex-1 max-w-8xl w-full mx-auto p-4 grid grid-cols-1 lg:grid-cols-12 gap-6">
        
        <section class="lg:col-span-4 bg-gray-900 p-4 rounded-xl border border-gray-800 flex flex-col h-[80vh]">
            <h2 class="text-xl font-medieval text-yellow-400 border-b border-gray-700 pb-2 mb-3">📜 Roster de la Cour d'Artois</h2>
            
            <select id="catalog-filter" class="w-full bg-gray-800 border border-gray-700 rounded p-2 mb-4 text-yellow-300 font-medium focus:outline-none focus:border-yellow-600">
                <option value="all">-- Toutes les catégories --</option>
                <option value="hero_spec">Personnages Spéciaux</option>
                <option value="heroes">Seigneurs & Héros</option>
                <option value="core">Unités de Base</option>
                <option value="special">Unités Spéciales</option>
                <option value="rare">Unités Rares</option>
            </select>

            <div id="catalog-container" class="flex-1 overflow-y-auto space-y-3 pr-1">
                </div>
        </section>

        <section class="lg:col-span-5 bg-gray-900 p-4 rounded-xl border-2 border-yellow-600 flex flex-col h-[80vh]">
            
            <div class="flex justify-between items-center border-b border-gray-700 pb-2 mb-3">
                <h2 class="text-xl font-medieval text-yellow-400">⚔️ Votre Hoste de Bataille</h2>
                <span class="bg-yellow-600 text-gray-950 font-medieval font-bold px-3 py-1 rounded text-lg">
                    Total : <span id="global-total">0</span> pts
                </span>
            </div>

            <div class="grid grid-cols-3 gap-2 mb-4">
                <button onclick="exportToPDF()" class="col-span-2 bg-blue-700 hover:bg-blue-600 text-white text-sm font-bold py-2 px-4 rounded transition flex items-center justify-center gap-2 shadow-md">
                    📄 EXPORTER L'HOSTE EN PDF
                </button>
                <button onclick="clearArmy()" class="bg-red-950 hover:bg-red-900 text-red-200 text-xs border border-red-700 rounded transition">
                    Vider la liste
                </button>
            </div>

            <div class="bg-gray-950 p-3 rounded-lg border border-gray-800 mb-4 space-y-2">
                <div class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-1">⚖️ Ratios de Composition de l'Armée :</div>
                
                <div class="grid grid-cols-5 gap-2 text-center text-[10px] font-medium text-gray-400">
                    <div>Perso. Spé.<span id="pct-hero_spec" class="block text-sm font-bold text-gray-200">0%</span></div>
                    <div>Sg & Héros<span id="pct-heroes" class="block text-sm font-bold text-gray-200">0%</span></div>
                    <div>Base (min 25%)<span id="pct-core" class="block text-sm font-bold text-red-400">0%</span></div>
                    <div>Spéciales<span id="pct-special" class="block text-sm font-bold text-gray-200">0%</span></div>
                    <div>Rares<span id="pct-rare" class="block text-sm font-bold text-gray-200">0%</span></div>
                </div>

                <div class="grid grid-cols-5 gap-1.5 h-1.5 mt-1">
                    <div class="bg-gray-800 rounded-full overflow-hidden"><div id="bar-hero_spec" class="bg-blue-500 h-full w-0 transition-all duration-300"></div></div>
                    <div class="bg-gray-800 rounded-full overflow-hidden"><div id="bar-heroes" class="bg-purple-500 h-full w-0 transition-all duration-300"></div></div>
                    <div class="bg-gray-800 rounded-full overflow-hidden"><div id="bar-core" class="bg-red-500 h-full w-0 transition-all duration-300"></div></div>
                    <div class="bg-gray-800 rounded-full overflow-hidden"><div id="bar-special" class="bg-yellow-500 h-full w-0 transition-all duration-300"></div></div>
                    <div class="bg-gray-800 rounded-full overflow-hidden"><div id="bar-rare" class="bg-red-400 h-full w-0 transition-all duration-300"></div></div>
                </div>
            </div>
            
            <div class="flex-1 overflow-y-auto pr-1">
                <div id="army-list" class="space-y-4"></div>
            </div>
        </section>

        <section class="lg:col-span-3 bg-gray-900 p-4 rounded-xl border border-gray-800 flex flex-col h-[80vh]">
            <h2 class="text-xl font-medieval text-yellow-400 border-b border-gray-700 pb-2 mb-3">📚 Grimoire & Arsenal</h2>
            
            <div class="flex gap-2 mb-3 text-xs">
                <button onclick="switchGrimoire('rules')" id="tab-rules" class="flex-1 py-1.5 px-2 font-bold bg-yellow-600 text-gray-950 rounded">Règles</button>
                <button onclick="switchGrimoire('items')" id="tab-items" class="flex-1 py-1.5 px-2 font-bold bg-gray-800 text-gray-400 rounded hover:bg-gray-700">Objets & Vertus</button>
            </div>

            <div id="grimoire-content" class="flex-1 overflow-y-auto space-y-3 text-xs text-gray-300 pr-1">
                </div>
        </section>
    </main>

    <script>
        const CAT_LABELS = {
            hero_spec: "👑 Personnages Spéciaux",
            heroes: "🛡️ Seigneurs & Héros",
            core: "🏹 Unités de Base",
            special: "🐎 Unités Spéciales",
            rare: "🪨 Unités Rares"
        };

        const CODEX = {
            units: [
                { id: 'louen', cat: 'hero_spec', name: 'Louen Cœur de Lion', basePts: 728, unique: true, rules: ['Bénédiction de la Dame', 'Fer de Lance', 'Grande Cible', 'Régénération'] },
                { id: 'green_knight', cat: 'hero_spec', name: 'Le Chevalier de Sinople', basePts: 275, unique: true, rules: ['Bénédiction de la Dame', 'Éthéré', 'Attaques Magiques'] },
                { id: 'fay', cat: 'hero_spec', name: 'La Fée Enchanteresse', basePts: 545, unique: true, rules: ['Bénédiction de la Dame', 'Maître de la Magie (Niv 4)', 'Aura de Pureté'] },
                { id: 'repanse', cat: 'hero_spec', name: 'Repanse de Lyonesse', basePts: 220, unique: true, rules: ['Vertu de Dévotion', 'Sceau de Lyonesse'] },
                
                { id: 'lord', cat: 'heroes', name: 'Seigneur Bretonnien', basePts: 140, rules: ['Serment du Chevalier', 'Présence Charismatique'], options: [{name:'Destrier Caparaçonné', pts:21}, {name:'Serment du Graal', pts:20}, {name:'Serment de la Quête', pts:12}] },
                { id: 'paladin', cat: 'heroes', name: 'Paladin (Porte-Bannière)', basePts: 60, rules: ['Serment du Chevalier'], options: [{name:'Grande Bannière', pts:25}, {name:'Destrier Caparaçonné', pts:14}] },
                { id: 'prophetess', cat: 'heroes', name: 'Prophétesse du Graal', basePts: 175, rules: ['Résistance à la Magie (2)'], options: [{name:'Niveau de Magie 4', pts:35}, {name:'Destrier', pts:15}] },
                { id: 'damoiselle', cat: 'heroes', name: 'Demoiselle du Graal', basePts: 105, rules: ['Résistance à la Magie (1)'], options: [{name:'Niveau de Magie 2', pts:35}] },
                
                { id: 'cotr', cat: 'core', name: 'Chevaliers du Royaume', perFigPts: 24, min: 5, rules: ['Fer de Lance', 'Serment du Chevalier'], options: [{name:'État-Major Complet', pts:24}] },
                { id: 'errants', cat: 'core', name: 'Chevaliers Errants', perFigPts: 20, min: 5, rules: ['Fer de Lance', 'Impétueux'], options: [{name:'État-Major Complet', pts:21}] },
                { id: 'men_at_arms', cat: 'core', name: 'Hommes d\'Armes', perFigPts: 5, min: 10, rules: ['Devoir du Paysan', 'Hallebarde & Bouclier'], options: [{name:'État-Major Complet', pts:15}] },
                { id: 'peasant_bowmen', cat: 'core', name: 'Archers Paysans', perFigPts: 6, min: 10, rules: ['Devoir du Paysan', 'Pieux Défensifs'], options: [{name:'Flèches Enflammées', pts:5}] },
                
                { id: 'pegasus_knights', cat: 'special', name: 'Chevaliers sur Pégase', perFigPts: 55, min: 3, rules: ['Cavalerie Volante', 'Fer de Lance'], options: [{name:'Champion Châtelain', pts:20}] },
                { id: 'quest_knights', cat: 'special', name: 'Chevaliers de la Quête', perFigPts: 28, min: 5, rules: ['Fer de Lance', 'Arme Lourde'], options: [{name:'État-Major Complet', pts:27}] },
                { id: 'mounted_yeomen', cat: 'special', name: 'Sergents Montés', perFigPts: 15, min: 5, rules: ['Devoir du Paysan', 'Cavalerie Légère'], options: [{name:'Boucliers', pts:1}] },
                { id: 'grail_reliquary', cat: 'special', name: 'Pèlerins & Reliquaire', basePts: 118, perFigPts: 9, min: 6, rules: ['Devoir du Paysan', 'Tenaces'], options: [] },

                { id: 'grail_knights', cat: 'rare', name: 'Chevaliers du Graal', perFigPts: 38, min: 3, rules: ['Fer de Lance', 'Serment du Graal', 'Attaques Magiques'], options: [{name:'Bannière de Châlons', pts:10}] },
                { id: 'trebuchet', cat: 'rare', name: 'Trébuchet de la Bretagne', basePts: 90, rules: ['Devoir du Paysan', 'Catapulte'], options: [{name:'Artisan Charpentier', pts:10}] }
            ],
            rules: {
                'Bénédiction de la Dame': 'Sauvegarde invulnérable de 6+ (5+ contre F5+).',
                'Fer de Lance': 'Permet aux figurines sur les flancs extérieurs de délivrer leurs attaques en charge.',
                'Devoir du Paysan': 'Ignore la panique des paysans et utilise le Commandement des Chevaliers proches.',
                'Serment du Chevalier': 'Immunisé à la panique causée par les paysans.'
            },
            items: {
                "--- VERTUS BRETONNIENNES ---": "Réservées aux personnages combattants.",
                "Vertu d'Héroïsme (+40 pts)": "Confère Coup Fatal Héroïque contre les grandes cibles.",
                "Vertu du Chevalier Impétueux (+35 pts)": "Ajoute +D6\" de portée à la première charge.",
                "Vertu de l'Idéal (+50 pts)": "+1 CC, +1 I, +1 A. Le porteur ne peut être le Général.",
                "Vertu d'Audace (+30 pts)": "Relance les jets pour blesser ratés contre l'endurance élevée (F5+).",
                "--- ARMES MAGIQUES ---": "Arsenal béni.",
                "Épée Courtoise (+40 pts)": "Relance les touches manquées lors des Défis.",
                "Épée du Graal (+60 pts)": "Attaques magiques blessant automatiquement sur 2+.",
                "Lance d'Artois (+25 pts)": "Donne Coup Fatal lors du tour où le porteur charge.",
                "--- ARMURES MAGIQUES ---": "Protections sacrées.",
                "Armure Brillante d'Agilgar (+45 pts)": "Sauvegarde d'armure de 3+ fixe non modifiable.",
                "Armure de la Quête (+30 pts)": "Permet de relancer les sauvegardes d'armure ratées.",
                "Bouclier du Graal (+35 pts)": "Améliore la Bénédiction de la Dame de l'unité.",
                "--- BANNIÈRES MAGIQUES ---": "Étendards sacrés.",
                "Bannière de la Dame (+100 pts)": "L'ennemi au contact perd ses bonus de rangs.",
                "Bannière de Châlons (+10 pts)": "Interdit les réactions de type 'Maintenir et Tirer'."
            }
        };

        let myArmy = [];

        function init() {
            renderCatalog();
            renderGrimoire('rules');
            renderArmy();
        }

        function renderCatalog() {
            const filter = document.getElementById('catalog-filter').value;
            const container = document.getElementById('catalog-container');
            container.innerHTML = '';

            const filtered = CODEX.units.filter(u => filter === 'all' || u.cat === filter);

            filtered.forEach(unit => {
                const costText = unit.perFigPts ? `${unit.perFigPts} pts/fig` : `${unit.basePts} pts`;
                const div = document.createElement('div');
                div.className = "bg-gray-800 p-2.5 rounded-lg border border-gray-700 flex justify-between items-center hover:border-yellow-600 transition shadow-sm text-xs";
                div.innerHTML = `
                    <div>
                        <h4 class="font-cinzel text-yellow-100 font-bold">${unit.name}</h4>
                        <p class="text-yellow-500 font-semibold">${costText} <span class="text-[10px] text-gray-400 font-normal">(${CAT_LABELS[unit.cat].split(' ')[1]})</span></p>
                    </div>
                    <button onclick="addUnitToArmy('${unit.id}')" class="bg-blue-700 hover:bg-blue-600 text-white font-bold w-7 h-7 rounded-full flex items-center justify-center text-md transition shadow">
                        +
                    </button>
                `;
                container.appendChild(div);
            });
        }

        function addUnitToArmy(unitId) {
            const template = CODEX.units.find(u => u.id === unitId);
            if (!template) return;
            
            if (template.unique && myArmy.some(u => u.id === unitId)) {
                alert(`👑 ${template.name} est unique et fait déjà partie de votre Hoste.`);
                return;
            }

            myArmy.push({
                instanceId: 'inst_' + Date.now() + '_' + Math.random().toString(36).substr(2, 4),
                id: template.id,
                cat: template.cat,
                name: template.name,
                basePts: template.basePts || 0,
                perFigPts: template.perFigPts || 0,
                qty: template.min || 1,
                rules: [...template.rules],
                availableOptions: template.options ? JSON.parse(JSON.stringify(template.options)) : [],
                selectedOptions: []
            });
            renderArmy();
        }

        function removeUnitInstance(instanceId) {
            myArmy = myArmy.filter(u => u.instanceId !== instanceId);
            renderArmy();
        }

        function updateQty(instanceId, val) {
            const unit = myArmy.find(u => u.instanceId === instanceId);
            if (unit) {
                unit.qty = Math.max(1, parseInt(val) || 1);
                recalculateTotal();
            }
        }

        function toggleOption(instanceId, optionName, isChecked) {
            const unit = myArmy.find(u => u.instanceId === instanceId);
            if (unit) {
                if (isChecked) unit.selectedOptions.push(optionName);
                else unit.selectedOptions = unit.selectedOptions.filter(o => o !== optionName);
                recalculateTotal();
            }
        }

        function clearArmy() {
            if(confirm("Disperser l'Hoste royal ?")) {
                myArmy = [];
                renderArmy();
            }
        }

        function recalculateTotal() {
            let globalTotal = 0;
            let catTotals = { hero_spec: 0, heroes: 0, core: 0, special: 0, rare: 0 };

            myArmy.forEach(unit => {
                let unitTotal = unit.perFigPts ? (unit.qty * unit.perFigPts) : unit.basePts;
                unit.selectedOptions.forEach(optName => {
                    const opt = unit.availableOptions.find(o => o.name === optName);
                    if (opt) unitTotal += opt.pts;
                });

                catTotals[unit.cat] += unitTotal;
                globalTotal += unitTotal;
                
                const badge = document.getElementById(`pts-badge-${unit.instanceId}`);
                if (badge) badge.innerText = `${unitTotal} pts`;
            });

            document.getElementById('global-total').innerText = globalTotal;

            // MISE À JOUR PERMANENTE DU DASHBOARD ET DES BARRES VISUELLES
            for (const cat in catTotals) {
                const pct = globalTotal > 0 ? Math.round((catTotals[cat] / globalTotal) * 100) : 0;
                
                const txtElement = document.getElementById(`pct-${cat}`);
                const barElement = document.getElementById(`bar-${cat}`);
                
                if (txtElement && barElement) {
                    txtElement.innerText = `${pct}%`;
                    barElement.style.width = `${Math.min(100, pct)}%`;

                    // Gestion dynamique des couleurs réglementaires
                    if (cat === 'core') {
                        if (pct < 25 && globalTotal > 0) {
                            txtElement.className = "block text-sm font-bold text-red-500 animate-pulse";
                            barElement.className = "bg-red-600 h-full w-0 transition-all";
                        } else {
                            txtElement.className = "block text-sm font-bold text-green-400";
                            barElement.className = "bg-green-500 h-full w-0 transition-all";
                        }
                    } else {
                        if (pct > 25) {
                            txtElement.className = "block text-sm font-bold text-orange-400";
                            barElement.className = "bg-orange-500 h-full w-0 transition-all";
                        } else {
                            txtElement.className = "block text-sm font-bold text-gray-200";
                        }
                    }
                }
            }
        }

        function renderArmy() {
            const listContainer = document.getElementById('army-list');
            if (myArmy.length === 0) {
                listContainer.innerHTML = `<div class="text-center text-gray-500 py-8 italic text-xs">Aucun bataillon actif. Intégrez des troupes depuis le catalogue.</div>`;
                recalculateTotal();
                return;
            }

            let htmlStr = '';

            for (const [catKey, catLabel] of Object.entries(CAT_LABELS)) {
                const unitsInCat = myArmy.filter(u => u.cat === catKey);
                if (unitsInCat.length > 0) {
                    htmlStr += `
                        <div class="space-y-2">
                            <h3 class="text-[11px] font-medieval tracking-wider uppercase text-yellow-500 border-b border-gray-800 pb-1">${catLabel}</h3>
                    `;

                    unitsInCat.forEach(unit => {
                        let optionsHTML = '';
                        if (unit.availableOptions.length > 0) {
                            optionsHTML = `<div class="mt-2 pt-2 border-t border-gray-800 space-y-1">`;
                            unit.availableOptions.forEach(opt => {
                                const isChecked = unit.selectedOptions.includes(opt.name) ? 'checked' : '';
                                optionsHTML += `
                                    <label class="flex items-center gap-2 text-[11px] text-gray-400 cursor-pointer">
                                        <input type="checkbox" onchange="toggleOption('${unit.instanceId}', '${opt.name}', this.checked)" ${isChecked} class="accent-yellow-600 rounded">
                                        <span>${opt.name} (+${opt.pts} pts)</span>
                                    </label>
                                `;
                            });
                            optionsHTML += `</div>`;
                        }

                        let qtyHTML = '';
                        if (unit.perFigPts) {
                            qtyHTML = `
                                <div class="flex items-center gap-1.5">
                                    <span class="text-[10px] text-gray-500">Effectif:</span>
                                    <input type="number" min="1" value="${unit.qty}" oninput="updateQty('${unit.instanceId}', this.value)" class="w-10 bg-gray-800 text-white text-center font-bold text-xs rounded border border-gray-700 p-0.5">
                                </div>
                            `;
                        }

                        htmlStr += `
                            <div class="bg-slate-900 border border-gray-800 rounded-lg p-3 relative hover:border-yellow-800 transition text-xs">
                                <div class="flex justify-between items-start gap-2">
                                    <div>
                                        <h4 class="font-cinzel font-bold text-yellow-400">${unit.name}</h4>
                                        <p class="text-[10px] text-gray-500 italic mt-0.5">Règles : ${unit.rules.join(', ')}</p>
                                    </div>
                                    <div class="flex items-center gap-2">
                                        ${qtyHTML}
                                        <span id="pts-badge-${unit.instanceId}" class="bg-gray-800 text-yellow-500 font-bold px-1.5 py-0.5 rounded border border-gray-700 text-[11px]">0 pts</span>
                                        <button onclick="removeUnitInstance('${unit.instanceId}')" class="text-gray-600 hover:text-red-500 font-bold px-1">✕</button>
                                    </div>
                                </div>
                                ${optionsHTML}
                            </div>
                        `;
                    });
                    htmlStr += `</div>`;
                }
            }

            listContainer.innerHTML = htmlStr;
            recalculateTotal();
        }

        function switchGrimoire(tab) {
            const btnRules = document.getElementById('tab-rules');
            const btnItems = document.getElementById('tab-items');
            if(tab === 'rules') {
                btnRules.className = "flex-1 py-1.5 px-2 font-bold bg-yellow-600 text-gray-950 rounded";
                btnItems.className = "flex-1 py-1.5 px-2 font-bold bg-gray-800 text-gray-400 rounded hover:bg-gray-700";
            } else {
                btnItems.className = "flex-1 py-1.5 px-2 font-bold bg-yellow-600 text-gray-950 rounded";
                btnRules.className = "flex-1 py-1.5 px-2 font-bold bg-gray-800 text-gray-400 rounded hover:bg-gray-700";
            }
            renderGrimoire(tab);
        }

        function renderGrimoire(type) {
            const container = document.getElementById('grimoire-content');
            container.innerHTML = '';
            for (const [key, val] of Object.entries(CODEX[type])) {
                const itemDiv = document.createElement('div');
                if (key.startsWith("---")) {
                    itemDiv.className = "pt-2 text-center border-b border-gray-800";
                    itemDiv.innerHTML = `<h5 class="text-yellow-600 font-bold text-[10px] tracking-wider uppercase">${key.replace(/---/g, '')}</h5>`;
                } else {
                    itemDiv.className = "bg-gray-950 p-2 rounded border border-gray-850";
                    itemDiv.innerHTML = `<h5 class="text-yellow-500 font-bold">${key}</h5><p class="text-gray-400 mt-0.5 text-[11px] leading-relaxed">${val}</p>`;
                }
                container.appendChild(itemDiv);
            }
        }

        function exportToPDF() {
            if(myArmy.length === 0) {
                alert("Votre armée ne compte aucun guerrier à inscrire sur les parchemins d'export.");
                return;
            }
            
            const total = document.getElementById('global-total').innerText;
            const printWindow = window.open('', '_blank');
            
            let printHTML = `
            <!DOCTYPE html>
            <html>
            <head>
                <title>Hoste de Bataille Bretonnien - ${total} pts</title>
                <style>
                    body { font-family: 'Helvetica Neue', Arial, sans-serif; color: #111; padding: 40px; line-height: 1.5; background: #fff; }
                    h1 { font-family: Georgia, serif; text-align: center; border-bottom: 3px double #000; padding-bottom: 8px; margin-bottom: 2px; }
                    .subtitle { text-align: center; font-style: italic; color: #666; font-size: 12px; margin-bottom: 25px; }
                    .total-box { text-align: right; font-size: 16px; font-weight: bold; margin-bottom: 20px; border-bottom: 1px solid #000; padding-bottom: 8px; }
                    .category-title { font-family: Georgia, serif; font-size: 14px; text-transform: uppercase; border-bottom: 2px solid #333; margin-top: 25px; padding-bottom: 4px; font-weight: bold; }
                    .unit-card { margin: 10px 0; padding: 10px; border: 1px solid #aaa; background: #fdfdfd; page-break-inside: avoid; }
                    .unit-header { display: flex; justify-content: space-between; font-weight: bold; font-size: 13px; }
                    .unit-rules { font-size: 11px; color: #555; margin-top: 4px; font-style: italic; }
                    .unit-options { font-size: 11px; color: #111; font-weight: bold; margin-top: 6px; padding-top: 4px; border-top: 1px dashed #ccc; }
                </style>
            </head>
            <body>
                <h1>⚔️ HOSTE DE BATAILLE BRETONNIEN ⚔️</h1>
                <div class="subtitle">"Honneur, Devoir, et Fidélité à la Dame du Lac"</div>
                <div class="total-box">Valeur de l'Armée : ${total} points réglementaires</div>
            `;

            for (const [catKey, catLabel] of Object.entries(CAT_LABELS)) {
                const units = myArmy.filter(u => u.cat === catKey);
                if (units.length > 0) {
                    printHTML += `<div class="category-title">${catLabel}</div>`;
                    units.forEach(u => {
                        let uTotal = u.perFigPts ? (u.qty * u.perFigPts) : u.basePts;
                        u.selectedOptions.forEach(oName => {
                            const oData = u.availableOptions.find(o => o.name === oName);
                            if (oData) uTotal += oData.pts;
                        });

                        const qtyStr = u.perFigPts ? `(Effectif : ${u.qty}x)` : '';
                        const optsStr = u.selectedOptions.length > 0 ? `<div class="unit-options">Options & Équipement : ${u.selectedOptions.join(', ')}</div>` : '';

                        printHTML += `
                            <div class="unit-card">
                                <div class="unit-header">
                                    <span>• ${u.name} ${qtyStr}</span>
                                    <span>${uTotal} pts</span>
                                </div>
                                <div class="unit-rules">Aptitudes : ${u.rules.join(', ')}</div>
                                ${optsStr}
                            </div>
                        `;
                    });
                }
            }

            printHTML += `
                <script>
                    window.onload = function() {
                        window.print();
                        setTimeout(function() { window.close(); }, 300);
                    };
                <\/script>
            </body>
            </html>`;
            
            printWindow.document.write(printHTML);
            printWindow.document.close();
        }

        document.getElementById('catalog-filter').addEventListener('change', renderCatalog);
        window.onload = init;
    </script>
</body>
</html>
